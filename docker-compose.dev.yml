x-backend-dev: &backend-dev
  build:
    context: .
    dockerfile: docker/node-dev.Dockerfile
  image: wiki-backend-dev
  working_dir: /workspace/apps/backend
  volumes:
    - .:/workspace
    - root_node_modules:/workspace/node_modules
    - backend_node_modules:/workspace/apps/backend/node_modules
    - worker_node_modules:/workspace/apps/worker/node_modules
    - frontend_node_modules:/workspace/apps/frontend/node_modules
    - shared_node_modules:/workspace/packages/shared/node_modules
  environment:
    NODE_ENV: development
    HOST: 0.0.0.0
    DATABASE_URL: postgresql://wiki:wiki@postgres:5432/wiki
    REDIS_URL: redis://redis:6379
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    CHOKIDAR_USEPOLLING: "true"
    CHOKIDAR_INTERVAL: 500
    TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *backend-dev
    command: pnpm dev
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"

  worker:
    <<: *backend-dev
    working_dir: /workspace/apps/worker
    command: pnpm dev

  frontend:
    build:
      context: .
      dockerfile: docker/node-dev.Dockerfile
    image: wiki-frontend-dev
    working_dir: /workspace/apps/frontend
    command: pnpm dev
    environment:
      NODE_ENV: development
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: 3000
      VITE_API_PROXY_TARGET: http://backend:3001
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: UseFsEventsWithFallbackDynamicPolling
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/apps/backend/node_modules
      - worker_node_modules:/workspace/apps/worker/node_modules
      - frontend_node_modules:/workspace/apps/frontend/node_modules
      - shared_node_modules:/workspace/packages/shared/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  root_node_modules:
  backend_node_modules:
  worker_node_modules:
  frontend_node_modules:
  shared_node_modules:
